[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gcloud-workspace-mcp"
version = "0.1.0"
description = "MCP server for Google Sheets and Drive using gcloud OAuth credentials"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0.0,<2",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
]

[project.scripts]
gcloud-workspace-mcp = "gcloud_workspace_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["gcloud_workspace_mcp"]
